# Servidor do VektraBot (Cloudflare Workers)
#
# Publicar:   npx wrangler deploy
# Chave:      npx wrangler secret put ANTHROPIC_API_KEY
# Testar:     npx wrangler dev   (precisa de bot-worker/.dev.vars com ANTHROPIC_API_KEY=...)

name = "vektrabot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# O .md da base de conhecimento entra no pacote como texto.
# Mudou o .md? Rode "npx wrangler deploy" de novo para o bot enxergar.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# Sites que podem conversar com o bot (separados por vírgula)
ORIGENS_PERMITIDAS = "https://dimitrifergus.github.io,http://localhost:8099,http://127.0.0.1:8099"
